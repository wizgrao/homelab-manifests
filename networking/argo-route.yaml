apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: default
spec:
  parentRefs:
    - name: argo-gateway
      namespace: argocd
      sectionName: websecure
  hostnames:
    - argo.internal.gauravity.com
  rules:
    - backendRefs:
        - name: argocd-server
          namespace: argocd
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: internal-tcp
  namespace: default
spec:
  parentRefs:
    - name: argo-gateway
      namespace: argocd
      sectionName: db-tcp
  rules:
    - backendRefs:
        - name: gauravity-pg-rw
          namespace: default
          port: 5432
